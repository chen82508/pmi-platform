# Open seats — incumbent NOT running in 2026 (term-limited, retiring, lost the
# primary, or running for another office). The seat is still HELD BY the party
# above (used for flip marking), but there is no running incumbent to anchor a
# zero-liquidity prior on — an open seat can flip — so the scoring liquidity floor
# KEEPS the thin market read for these rather than asserting the departing party
# holds (see aggregator._zero_liquidity_pr). Sourced 2026-09-13 from the same
# Wikipedia pages. States only (territories/DC not tracked). House open seats are
# not compiled, but the whole house roster is null so house always keeps the thin
# read regardless.
#
# Shape: {office: {cycle_year: [state_code, ...]}}.
open_seats:
  senate:
    2026: [AL, IA, IL, KY, LA, MI, MN, MT, NC, NH, TX, WY]
  governor:
    2026: [AK, AL, CA, CO, FL, GA, IA, KS, ME, MI, MN, NM, OH, OK, SC, TN, WI, WY]
