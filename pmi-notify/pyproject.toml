[project]
name = "pmi-notify"
version = "0.1.0"
description = "Reusable, vendor-neutral notification decorators (Slack webhook adapter) for non-frontend PMI platform services."
readme = "README.md"
requires-python = ">=3.12"

# Deliberately has NO dependency on pmi-core: this package must be importable
# by pmi-core itself (e.g. to decorate pipeline/backtest entry points) without
# creating a dependency cycle. Config is read from raw environment variables
# instead of pydantic-settings for the same reason (mirrors the precedent in
# pmi_core/observability.py's init_sentry).
dependencies = [
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmi_notify"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
